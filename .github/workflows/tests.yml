name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[mcp,test]"
      - name: Run tests
        run: pytest tests/
        env:
          # fckgit.py checks for the key at import time; tests never call Gemini
          GEMINI_API_KEY: test-key-not-real
